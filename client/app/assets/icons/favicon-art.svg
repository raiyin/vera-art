<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brushGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007F45" />
      <stop offset="50%" stop-color="#00C16A" />
      <stop offset="100%" stop-color="#00DC82" />
    </linearGradient>
    <linearGradient id="paletteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="25%" stop-color="#4ECDC4" />
      <stop offset="50%" stop-color="#FFD166" />
      <stop offset="75%" stop-color="#06D6A0" />
      <stop offset="100%" stop-color="#118AB2" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0A5331" opacity="0.9" />
  
  <!-- Artist palette -->
  <circle cx="32" cy="32" r="20" fill="url(#paletteGradient)" stroke="#052E16" stroke-width="1.5" />
  
  <!-- Palette thumb hole -->
  <circle cx="42" cy="22" r="4" fill="#0A5331" />
  
  <!-- Paintbrush handle -->
  <rect x="15" y="40" width="20" height="4" rx="2" fill="#8B4513" transform="rotate(45 25 42)" />
  
  <!-- Paintbrush bristles -->
  <path d="M 30,38 L 38,30 L 42,34 L 34,42 Z" fill="#007F45" />
  <path d="M 34,42 L 42,34 L 44,36 L 36,44 Z" fill="#00A155" />
  <path d="M 36,44 L 44,36 L 46,38 L 38,46 Z" fill="#00C16A" />
  
  <!-- Brush tip highlight -->
  <ellipse cx="40" cy="36" rx="2" ry="1" fill="#FFFFFF" opacity="0.3" />
  
  <!-- Artistic dots around the palette -->
  <circle cx="20" cy="25" r="2" fill="#FF6B6B" />
  <circle cx="25" cy="18" r="2" fill="#4ECDC4" />
  <circle cx="35" cy="15" r="2" fill="#FFD166" />
  <circle cx="45" cy="25" r="2" fill="#06D6A0" />
  <circle cx="40" cy="35" r="2" fill="#118AB2" />
</svg>